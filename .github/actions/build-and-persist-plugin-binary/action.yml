name: build-and-persist-plugin-binary
inputs:
  GOOS:
    required: true
  GOARCH:
    required: true
runs:
  using: composite
  steps:
  - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  - run: "GOOS=${{ inputs.GOOS }} GOARCH=${{ inputs.GOARCH }} go build -o ./pkg/packer_plugin_lxc_${{ inputs.GOOS }}_${{ inputs.GOARCH }} ."
    shell: bash
  - run: zip ./pkg/packer_plugin_lxc_${{ inputs.GOOS }}_${{ inputs.GOARCH }}.zip ./pkg/packer_plugin_lxc_${{ inputs.GOOS }}_${{ inputs.GOARCH }}
    shell: bash
  - run: rm ./pkg/packer_plugin_lxc_${{ inputs.GOOS }}_${{ inputs.GOARCH }}
    shell: bash
  - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
    with:
      name: "packer_plugin_lxc_${{ inputs.GOOS }}_${{ inputs.GOARCH }}.zip"
      path: "pkg/packer_plugin_lxc_${{ inputs.GOOS }}_${{ inputs.GOARCH }}.zip"
      retention-days: 30
